<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>استعادة كلمة المرور في S.K.F</title>
  </head>
  <!-- Spec 0017 AC-7: the reset email. The link goes to /auth/confirm on the site that asked
       (`RedirectTo`), which waits for a button press before it uses the token. -->
  <body
    style="
      margin: 0;
      padding: 24px 16px;
      background: #f5f3ee;
      font-family: Tahoma, Arial, sans-serif;
      color: #111111;
      direction: rtl;
      text-align: right;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="
        max-width: 480px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #dddddd;
        border-radius: 12px;
      "
    >
      <tr>
        <td style="padding: 24px 20px">
          <p style="margin: 0 0 12px; font-size: 20px; font-weight: bold">استعادة كلمة المرور</p>
          <p style="margin: 0 0 16px; font-size: 16px; line-height: 1.7">
            طلبت تعيين كلمة مرور جديدة لحسابك في S.K.F للإنارة. اضغط الزر لتعيينها.
          </p>
          <p style="margin: 0 0 20px">
            <a
              href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery"
              style="
                display: inline-block;
                padding: 14px 24px;
                background: #ffd400;
                color: #111111;
                border: 1px solid #111111;
                border-radius: 12px;
                font-size: 16px;
                font-weight: bold;
                text-decoration: none;
              "
              >تعيين كلمة مرور جديدة</a
            >
          </p>
          <p style="margin: 0; font-size: 14px; line-height: 1.7; color: #555555">
            الرابط صالح لساعة واحدة ويُستخدم مرة واحدة. إن لم تطلب ذلك فتجاهل هذه الرسالة، وتبقى
            كلمة مرورك كما هي.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
