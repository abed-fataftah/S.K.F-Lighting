# Spec 0006 AC-15: the weekly backstop for product files. Removes `products/<id>/` folders in Storage
# whose product is gone and whose newest file is more than a day old. Secrets live in the `production`
# environment: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, and MEDIA_SWEEP_DATABASE_URL (the `media_sweep`
# login over the session pooler, which can read product ids and nothing else).
name: Media sweep

on:
  schedule:
    # Mondays at 03:17 UTC, away from the top of the hour.
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: media-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    name: Remove orphan product folders
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm media:sweep
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MEDIA_SWEEP_DATABASE_URL: ${{ secrets.MEDIA_SWEEP_DATABASE_URL }}
